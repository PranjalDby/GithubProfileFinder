name: Github-workflow
runs-name: ${{ github.actor }} runs-actions
on: [push]
jobs:
  upgrade-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - run: npm install -g @bemedev/upgrade-npm-package
      - run: upgrade-npm-package -v -p npm


